name: Live Twitch and Spotify E2E

on:
  workflow_dispatch:
    inputs:
      stage:
        description: Run the live tests using saved OAuth credentials, or bootstrap Spotify authorization
        required: true
        type: choice
        options:
          - run_live_test
          - authorize_spotify
        default: run_live_test
      spotify_auth_run_id:
        description: Authorize Spotify only for first setup or reauthorization; enter the authorize_spotify run ID
        required: false
        type: string
      spotify_callback_url:
        description: Complete loopback callback URL for first setup or reauthorization (one-time credential)
        required: false
        type: string
      run_real_chat_test:
        description: Also wait for real viewer and broadcaster/moderator !skip messages in Twitch chat
        required: false
        type: boolean
        default: false

permissions:
  contents: read
  actions: read

concurrency:
  group: community-playlist-live-e2e
  cancel-in-progress: false

jobs:
  authorize-spotify:
    if: inputs.stage == 'authorize_spotify'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Create Spotify PKCE authorization request
        env:
          SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
          SPOTIFY_REDIRECT_URI: http://127.0.0.1:4173/
          SPOTIFY_PKCE_HANDOFF_KEY: ${{ secrets.SPOTIFY_PKCE_HANDOFF_KEY }}
        run: node scripts/e2e/spotify-pkce-handoff.js create

      - name: Store encrypted PKCE handoff for the test run
        uses: actions/upload-artifact@v4
        with:
          name: spotify-pkce-${{ github.run_id }}
          path: .ci-auth/spotify-pkce-handoff.json
          if-no-files-found: error
          retention-days: 1

  live-e2e:
    if: inputs.stage == 'run_live_test'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TWITCH_CLIENT_ID: ${{ vars.TWITCH_CLIENT_ID || secrets.TWITCH_CLIENT_ID }}
      SPOTIFY_CLIENT_ID: ${{ vars.SPOTIFY_CLIENT_ID }}
      SPOTIFY_PLAYLIST_URI: ${{ vars.SPOTIFY_PLAYLIST_URI }}
      E2E_TRACK_X: ${{ vars.E2E_TRACK_X }}
      E2E_TRACK_Y: ${{ vars.E2E_TRACK_Y }}
      TWITCH_BROADCASTER_ID: ${{ vars.TWITCH_BROADCASTER_ID }}
      TWITCH_POWER_UP_ID: ${{ vars.TWITCH_POWER_UP_ID }}
      SPOTIFY_DEVICE_ID: ${{ vars.SPOTIFY_DEVICE_ID }}
      RUN_REAL_CHAT_TEST: ${{ inputs.run_real_chat_test }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Run syntax and automated tests
        run: npm run verify

      - name: Locate the latest encrypted OAuth vault
        id: oauth-vault
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/e2e/find-oauth-vault-artifact.js

      - name: Download the saved encrypted OAuth vault
        if: steps.oauth-vault.outputs.found == 'true'
        uses: actions/download-artifact@v4
        with:
          name: community-playlist-oauth-vault
          run-id: ${{ steps.oauth-vault.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .ci-auth

      - name: Download Spotify PKCE handoff for first setup or reauthorization
        if: inputs.spotify_auth_run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: spotify-pkce-${{ inputs.spotify_auth_run_id }}
          run-id: ${{ inputs.spotify_auth_run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: .ci-auth

      - name: Install Playwright
        run: npm install --no-save --package-lock=false playwright@1.65.1

      - name: Install Chromium and system dependencies
        run: ./node_modules/.bin/playwright install --with-deps chromium

      - name: Reuse or authorize provider sessions and rotate the encrypted vault
        env:
          SPOTIFY_PKCE_HANDOFF_KEY: ${{ secrets.SPOTIFY_PKCE_HANDOFF_KEY }}
        run: node scripts/e2e/prepare-oauth.js

      - name: Persist encrypted OAuth vault before live playback tests
        uses: actions/upload-artifact@v4
        with:
          name: community-playlist-oauth-vault
          path: .ci-auth/community-playlist-oauth-vault.json
          if-no-files-found: error
          overwrite: true

      - name: Run live Twitch and Spotify E2E
        run: node scripts/e2e/ci-runner.js
